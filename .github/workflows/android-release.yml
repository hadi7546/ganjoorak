name: Android Release

on:
  push:
    branches:
      - master
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Read app version
        id: version
        working-directory: ${{ github.workspace }}
        run: |
          VERSION_NAME=$(grep 'versionName' android/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' android/app/build.gradle.kts | head -1 | sed -E 's/.*([0-9]+).*/\1/')
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=android-v${VERSION_NAME}-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "apk_name=ganjoorak-${VERSION_NAME}-build${GITHUB_RUN_NUMBER}.apk" >> "$GITHUB_OUTPUT"

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/android/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=${{ github.workspace }}/android/release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using release keystore from repository secrets."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret; release will be signed with the debug keystore."
          fi

      - name: Build release APK
        env:
          CI: true
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        working-directory: ${{ github.workspace }}
        run: |
          APK_SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK_SRC" ]; then
            echo "No release APK found" >&2
            exit 1
          fi
          cp "$APK_SRC" "android/app/build/outputs/apk/release/${{ steps.version.outputs.apk_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Ganjoorak Android ${{ steps.version.outputs.name }} (build ${{ github.run_number }})
          body: |
            Automated Android release for commit ${{ github.sha }}.

            **Version:** ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
            **Install:** download the APK below and open it on your device (enable install from unknown sources if needed).

            Built from [`${{ github.ref_name }}`](${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}).
          files: |
            android/app/build/outputs/apk/release/${{ steps.version.outputs.apk_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
