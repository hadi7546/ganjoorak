name: Desktop Release

on:
  push:
    branches:
      - master
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

env:
  GANJOOR_API_BASE_URL: http://api.offline.ganjoor.net
  NEXT_PUBLIC_GANJOOR_API_BASE_URL: http://api.offline.ganjoor.net

jobs:
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Ganjoorak web
        uses: actions/checkout@v4
        with:
          repository: hadi7546/ganjoorak
          path: ganjoorak-web

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            ganjoorak-web/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install desktop tooling
        run: npm ci

      - name: Generate app icons
        run: npm run prepare:icons

      - name: Read desktop version
        id: version
        working-directory: ${{ github.workspace }}
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v${VERSION}-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build Linux packages
        env:
          GANJOORAK_WEB_DIR: ${{ github.workspace }}/ganjoorak-web
        run: npm run build

      - name: Collect artifacts
        id: artifacts
        working-directory: ${{ github.workspace }}
        run: |
          shopt -s nullglob
          files=(
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .deb or AppImage artifacts found" >&2
            find desktop/src-tauri/target/release/bundle -type f 2>/dev/null || true
            exit 1
          fi
          mkdir -p desktop/dist-artifacts
          for f in "${files[@]}"; do
            cp "$f" desktop/dist-artifacts/
            echo "Collected $(basename "$f")"
          done
          ls -la desktop/dist-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Ganjoorak Desktop ${{ steps.version.outputs.name }} (build ${{ github.run_number }})
          body: |
            Automated Linux desktop release for commit ${{ github.sha }}.

            **Version:** ${{ steps.version.outputs.name }}
            **Install:** download the `.deb` (Debian/Ubuntu) or `.AppImage` (portable) below.

            Built from [`${{ github.ref_name }}`](${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}).
          files: desktop/dist-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
