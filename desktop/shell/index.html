<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>گنجورک</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0f;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --accent: #c4b5fd;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family:
          "Vazirmatn",
          "Shabnam",
          system-ui,
          -apple-system,
          sans-serif;
      }
      body {
        display: grid;
        place-items: center;
      }
      .card {
        text-align: center;
        padding: 2rem;
        max-width: 20rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        font-weight: 700;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }
      .spinner {
        width: 2.5rem;
        height: 2.5rem;
        margin: 1.5rem auto 0;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>گنجورک</h1>
      <p>در حال آماده‌سازی برنامه…</p>
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </body>
</html>
